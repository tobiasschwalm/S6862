schema: spec-driven

context: |
  Hello World im Browser: index.html zeigt eine Begrüßung.
  Browseranwendung in JavaScript ohne externe Abhängigkeiten: kein package.json, keine Pakete, kein Build-Schritt, nichts von fremden Adressen.
  Eigener Code unter src/, eingebunden als klassisches <script src="..."> ohne type="module".
  Die Capability heißt begruessung.
  Artefakte auf Deutsch, die Schlüsselwörter SHALL, MUST, WHEN und THEN bleiben englisch.

rules:
  tasks:
    - Jeden Task erledigt der Agent selbst, kein Task wartet auf eine Person.
